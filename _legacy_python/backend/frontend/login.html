<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Toko Sembako Berkah</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="halaman-auth">

    <div class="auth-box">
        <h2>Masuk ke Akun</h2>
        <p>Sistem Manajemen Toko Sembako Berkah</p>

        <form>
            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="Masukkan username" class="input-field">
            </div>
            <div class="form-group">
                <label>Kata Sandi</label>
                <input type="password" placeholder="Masukkan kata sandi" class="input-field">
            </div>
            <button type="submit" class="btn-primary btn-full">Masuk</button>
        </form>

        <p class="auth-link">Belum punya akun? <a href="daftar.html">Daftar sekarang</a></p>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
