<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Toko Sembako Berkah</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="halaman-auth">

    <div class="auth-box">
        <h2>Daftar Akun</h2>
        <p>Buat akun untuk mengelola toko sembako</p>

        <form>
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" placeholder="Nama lengkap" class="input-field">
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="Username" class="input-field">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Email" class="input-field">
            </div>
            <div class="form-group">
                <label>Kata Sandi</label>
                <input type="password" placeholder="Kata sandi" class="input-field">
            </div>
            <button type="submit" class="btn-primary btn-full">Daftar</button>
        </form>
        <p class="auth-link">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
