<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategori - Toko Sembako Berkah</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <h1 class="logo">Toko Sembako Berkah</h1>
            <ul class="nav-links">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="produk.html">Produk</a></li>
                <li><a href="kategori.html" class="active">Kategori</a></li>
                <li><a href="transaksi.html">Transaksi</a></li>
                <li><a href="profil.html">Profil</a></li>
                <li><a href="login.html" class="btn-masuk">Masuk</a></li>
            </ul>
        </div>
    </nav>

    <section class="page-content">
        <div class="container">
            <h2>Manajemen Kategori</h2>

            <div class="toolbar">
                <input type="text" placeholder="Nama kategori baru..." class="input-cari">
                <button class="btn-primary">Simpan Kategori</button>
            </div>

            <div class="kategori-grid">
                <div class="kategori-card">
                    <h4>Beras</h4>
                    <p>12 produk</p>
                    <button class="btn-small btn-edit">Edit</button>
                    <button class="btn-small btn-hapus">Hapus</button>
                </div>
                <div class="kategori-card">
                    <h4>Minyak</h4>
                    <p>8 produk</p>
                    <button class="btn-small btn-edit">Edit</button>
                    <button class="btn-small btn-hapus">Hapus</button>
                </div>
                <div class="kategori-card">
                    <h4>Gula</h4>
                    <p>5 produk</p>
                    <button class="btn-small btn-edit">Edit</button>
                    <button class="btn-small btn-hapus">Hapus</button>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Toko Sembako Berkah. Sistem Manajemen Toko Sembako.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
